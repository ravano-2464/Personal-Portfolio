<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Sonara Web Apps Project Preview</title>
  <desc id="desc">Cover artwork for Sonara Web Apps portfolio project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#270A1B" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />
  <circle cx="1040" cy="120" r="240" fill="#F9A8D4" fill-opacity="0.24" filter="url(#softGlow)" />
  <circle cx="1130" cy="580" r="190" fill="#FDA4AF" fill-opacity="0.2" filter="url(#softGlow)" />
  <path d="M0 600 C260 500 460 720 780 620 C960 560 1140 450 1280 510 L1280 720 L0 720 Z" fill="rgba(255,255,255,0.09)" />

  <rect x="56" y="56" width="1168" height="608" rx="28" fill="rgba(8,15,36,0.34)" stroke="rgba(255,255,255,0.17)" />
  <rect x="72" y="82" width="420" height="44" rx="22" fill="rgba(255,255,255,0.16)" />
  <text x="98" y="111" fill="rgba(255,255,255,0.92)" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="600" letter-spacing="1.2">WEB APPLICATION</text>

  <text x='72' y='430' fill='rgba(255,255,255,0.95)' font-size='58' font-family='Segoe UI, Arial, sans-serif' font-weight='700' letter-spacing='0.4'>Sonara Web Apps</text>

  <text x="72" y="574" fill="rgba(255,255,255,0.78)" font-size="22" font-family="Consolas, 'Courier New', monospace" letter-spacing="1.2">/projects/sonara-web-apps.svg</text>

  <g transform="translate(850 258)">
    <rect x="0" y="0" width="320" height="210" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" />
    <path d="M28 56 H292" stroke="#FDA4AF" stroke-width="8" stroke-linecap="round" />
    <path d="M28 100 H242" stroke="rgba(255,255,255,0.45)" stroke-width="8" stroke-linecap="round" />
    <path d="M28 144 H188" stroke="rgba(255,255,255,0.36)" stroke-width="8" stroke-linecap="round" />
    <circle cx="270" cy="164" r="24" fill="#F9A8D4" fill-opacity="0.85" />
  </g>
</svg>
